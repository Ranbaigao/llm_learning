site_name: 我的LLM笔记
theme:
  name: material
  logo: .assets/Gemini_Generated_Image_qj4q72qj4q72qj4q.png
  favicon: .assets/Gemini_Generated_Image_qj4q72qj4q72qj4q2.png

docs_dir: notebooks/ # 将项目根目录设为文档根目录

# 自定义钩子: 在构建前自动扫描 notebooks/ 生成知识图谱数据
hooks:
  - hooks/generate_graph_data.py

plugins:
  - search
  - mkdocs-jupyter

# 显式声明不要排除 .assets 目录（注意感叹号）
exclude_docs: |
  !.assets

# 启用数学公式解析扩展
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true          # 配合你目前的 JS，输出 <span class="arithmatex">\( ... \)</span>
      smart_dollar: false    # 【关键！】关闭智能美元符，包容 AI 生成的各种不规范空格
      block_syntax:
        - dollar             # 支持 $$ ... $$
        - square             # 支持 \[ ... \]
        - begin              # 支持 \begin{...} ... \end{...} 直接成块
      inline_syntax:
        - dollar             # 支持 $ ... $
        - round              # 支持 \( ... \)
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path:
        - notebooks
      check_paths: true # 推荐开启：如果引入的文件路径不对，会在 build 时报错提示



# 引入本地配置与在线数学引擎
extra_javascript:
  - .assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
