site_name: LLM知识库
theme:
  name: material
  logo: .assets/Gemini_Generated_Image_qj4q72qj4q72qj4q.png
  favicon: .assets/Gemini_Generated_Image_qj4q72qj4q72qj4q2.png

docs_dir: notebooks/ # 将项目根目录设为文档根目录

# 自定义钩子: 在构建前自动扫描 notebooks/ 生成知识图谱数据
hooks:
  - hooks/generate_graph_data.py

plugins:
  - search
  - mkdocs-jupyter

# 显式声明不要排除 .assets 目录（注意感叹号）
exclude_docs: |
  !.assets

# 启用数学公式解析扩展
markdown_extensions:
  - tables                       # 支持 GFM 风格的 Markdown 表格（| --- |）
  - pymdownx.arithmatex:
      generic: true          # 配合你目前的 JS，输出 <span class="arithmatex">\( ... \)</span>
      smart_dollar: false    # 【关键！】关闭智能美元符，包容 AI 生成的各种不规范空格
      block_syntax:
        - dollar             # 支持 $$ ... $$
        - square             # 支持 \[ ... \]
        - begin              # 支持 \begin{...} ... \end{...} 直接成块
      inline_syntax:
        - dollar             # 支持 $ ... $
        - round              # 支持 \( ... \)
  - mdx_truly_sane_lists         # 列表无需前置空行也能解析（兼容 AI 生成的不规范列表）
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path:
        - notebooks
      check_paths: true # 推荐开启：如果引入的文件路径不对，会在 build 时报错提示
  
  # --- 2. 新增：代码块渲染核心扩展 ---
  - pymdownx.highlight:
      anchor_linenums: true       # 点击行号可以生成锚点链接
      line_spans: __span          # 提高行号在 Material 主题中的样式兼容性
      pygments_lang_class: true   # 允许根据语言自动适配 Material 的白天/黑夜主题
  - pymdownx.inlinehilite         # 支持行内代码高亮，例如 `python import os`
  - pymdownx.superfences          # 【最核心】完美支持 ``` 围栏代码块，且允许在列表、引用中嵌套代码块


extra_css:
  - .assets/stylesheets/pageview.css   # 浏览量统计样式
  - .assets/stylesheets/html_modal.css # HTML 弹窗查看器样式

# 引入本地配置与在线数学引擎
extra_javascript:
  - .assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - .assets/javascripts/pageview.js    # 注入浏览量统计元素（必须先于统计服务脚本执行）
  - .assets/javascripts/html_modal.js  # HTML 弹窗查看器（拦截 .html-modal-link 点击）
  - https://cn.vercount.one/js         # Vercount 浏览量统计服务（兼容不蒜子标记）
