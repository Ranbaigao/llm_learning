# 推送 main 分支后自动构建并部署到 GitHub Pages（gh-pages 分支）
# 替代手动执行 mkdocs gh-deploy 的本地发布流程
name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write # mkdocs gh-deploy 需要向 gh-pages 分支推送

concurrency:
  group: mkdocs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # hooks/generate_graph_data.py 会在构建前自动生成知识图谱数据，无需额外步骤
      - name: Build and deploy
        run: mkdocs gh-deploy --force
