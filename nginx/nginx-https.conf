# HTTPS 版配置（备用）：域名备案完成后用本文件覆盖 nginx.conf 生效。
# 前置：宿主机 certbot 已签证书；本文件内 your-domain.com（4 处）已替换为真实域名。
# 详见 thinking/deploy-to-production.md 第五节。
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml font/woff2;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # HTTP：全部 301 到 HTTPS
    server {
        listen 80;
        server_name your-domain.com;    # ← 替换为真实域名

        return 301 https://$host$request_uri;
    }

    # HTTPS：正式入口
    server {
        listen 443 ssl;
        http2 on;
        server_name your-domain.com;    # ← 替换为真实域名

        # Let's Encrypt 证书（宿主机 /etc/letsencrypt 只读挂载进容器）
        ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 确认 HTTPS 稳定运行后再取消注释（一旦开启，浏览器对该域名强制走 HTTPS）
        # add_header Strict-Transport-Security "max-age=31536000" always;

        # 后端静态资产（content/.assets：图片/字体/html）：长缓存
        location /api/assets/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
