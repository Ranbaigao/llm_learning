<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knowledge Graph · 我的 LLM 笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-color: #030712;
    --text-color: #cbd5e1;
    --title-color: #f1f5f9;
    --panel-bg: rgba(10, 16, 32, 0.58);
    --border-color: rgba(148, 163, 184, 0.16);
    --panel-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    --accent-primary: #60a5fa;
    --accent-text: #93c5fd;
    --accent-light: rgba(59, 130, 246, 0.20);
    --success: #4ade80;
    --warning: #fbbf24;
    --muted: #7d8ca3;
    --root-color: #f1f5f9;
    --llm-color: #60a5fa;
    --cv-color: #2dd4bf;
    --performance-color: #fbbf24;
    --app-color: #a78bfa;
    --practice-color: #22d3ee;
    --reference-color: #a78bfa;
  }

  * { box-sizing: border-box; }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg-color);
    color: var(--text-color);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(circle at 24% 16%, rgba(28, 50, 105, 0.14) 0, transparent 46%),
      radial-gradient(circle at 80% 22%, rgba(48, 24, 88, 0.10) 0, transparent 48%),
      radial-gradient(circle at 56% 88%, rgba(7, 30, 52, 0.16) 0, transparent 55%),
      radial-gradient(circle at 8% 78%, rgba(40, 20, 66, 0.10) 0, transparent 42%),
      linear-gradient(160deg, #01020a 0%, #020410 48%, #03061a 100%);
  }

  .app::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(148, 163, 184, 0.028) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(148, 163, 184, 0.024) 0 1px, transparent 1px 40px);
    mask-image: linear-gradient(180deg, transparent 0%, black 16%, black 84%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 16%, black 84%, transparent 100%);
  }

  #scene {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }

  #scene.is-dragging { cursor: grabbing; }

  #labels {
    position: absolute;
    inset: 0;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
    contain: layout style paint;
  }

  .graph-label {
    position: absolute;
    left: 0;
    top: 0;
    max-width: 220px;
    color: var(--label-color, #cbd5e1);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, system-ui, sans-serif;
    line-height: 1.16;
    letter-spacing: 0.05em;
    text-align: center;
    white-space: nowrap;
    text-shadow:
      0 1px 0 rgba(2, 6, 23, 0.92),
      0 -1px 0 rgba(2, 6, 23, 0.86),
      1px 0 0 rgba(2, 6, 23, 0.86),
      -1px 0 0 rgba(2, 6, 23, 0.86),
      0 0 12px rgba(2, 6, 23, 0.60);
    transform: translate3d(-999px, -999px, 0) translateX(-50%);
    transform-origin: 50% 0;
    will-change: transform, opacity;
    transition: opacity 240ms ease;
  }

  .graph-label--note { font-weight: 500; }

  .panel {
    position: absolute;
    z-index: 4;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: var(--panel-shadow);
    backdrop-filter: blur(10px) saturate(130%);
    -webkit-backdrop-filter: blur(10px) saturate(130%);
  }

  /* 统计图谱 - 调整到右下方位置互换 */
  .header-panel {
    bottom: 18px;
    right: 18px;
    width: min(430px, calc(100vw - 36px));
    padding: 14px 16px;
  }

  .eyebrow {
    margin: 0 0 4px;
    color: var(--accent-text);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .header-panel h1 {
    margin: 0;
    color: var(--title-color);
    font-size: 19px;
    line-height: 1.2;
    font-weight: 750;
  }

  .metric-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 7px;
    margin-top: 12px;
  }

  .metric {
    min-width: 0;
    padding: 7px 8px;
    background: rgba(148, 163, 184, 0.07);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 8px;
  }

  .metric strong {
    display: block;
    color: var(--title-color);
    font-size: 16px;
    line-height: 1;
  }

  .metric span {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 10px;
    white-space: nowrap;
  }

  /* 站点总浏览量：标题下方的弱化一行 */
  .site-view-stats {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.02em;
  }

  .site-view-stats strong {
    color: var(--accent-text);
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }

  /* 侧边栏笔记行的阅读量（小眼睛图标 + 数字） */
  .tree-pv {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    color: var(--muted);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .tree-pv[hidden] { display: none; }

  .tree-pv svg { width: 11px; height: 11px; stroke-width: 2; opacity: 0.75; }

  .legend-panel {
    top: 18px;
    right: 18px;
    min-width: 166px;
    padding: 11px 12px;
    display: grid;
    gap: 8px;
  }

  .legend-title {
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #cbd5e1;
    font-size: 12px;
    line-height: 1.1;
  }

  .legend-dot {
    width: 11px;
    height: 11px;
    border-radius: 999px;
    box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 14%, transparent);
    flex: 0 0 auto;
  }

  /* 星图签名：顶部居中的随机名言，纤细行楷 + 动态科技蓝边缘光，纯装饰不拦截画布交互 */
  .quote-panel {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: 24px;
    /* 避开左上搜索框与右上图例（分别约 330px / 190px 宽） */
    width: min(880px, calc(100vw - 760px));
    transform: translateX(-50%);
    pointer-events: none;
    user-select: none;
    text-align: center;
    /* 远层晕光：作用于整段文字的渲染结果，跟随实际字形与换行，无副本错位问题 */
    filter: drop-shadow(0 0 14px rgba(37, 99, 235, 0.55));
    animation: quote-edge-far 5.3s ease-in-out infinite;
  }

  .quote-text {
    margin: 0;
    font-family: "Long Cang", "Zhi Mang Xing", "Ma Shan Zheng", "STXingkai", "华文行楷", "KaiTi", "楷体", cursive;
    font-size: 28px;
    letter-spacing: 0.12em;
    line-height: 1.8;
    text-wrap: balance;
    color: #eaf2ff;
    text-shadow:
      0 0 3px rgba(224, 242, 254, 0.85),
      0 0 12px rgba(125, 211, 252, 0.50),
      0 0 30px rgba(56, 189, 248, 0.35);
    /* 近层边缘光：drop-shadow 沿字形轮廓发光 */
    filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.9));
    animation:
      quote-fade-in 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both,
      quote-core-pulse 4.6s ease-in-out 2.2s infinite,
      quote-edge-near 3.4s ease-in-out infinite;
  }

  /* 按标点切分出的短句：句内禁止换行，句间由 <wbr> 提供断点，保证只在标点处换行 */
  .qseg { white-space: nowrap; }

  @keyframes quote-fade-in {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 主文字核心辉光脉动 */
  @keyframes quote-core-pulse {
    0%, 100% {
      text-shadow:
        0 0 3px rgba(224, 242, 254, 0.85),
        0 0 12px rgba(125, 211, 252, 0.50),
        0 0 30px rgba(56, 189, 248, 0.35);
    }
    50% {
      text-shadow:
        0 0 4px rgba(224, 242, 254, 1),
        0 0 18px rgba(125, 211, 252, 0.72),
        0 0 44px rgba(56, 189, 248, 0.50);
    }
  }

  /* 近层边缘光：快速小幅脉动 */
  @keyframes quote-edge-near {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.9)); }
    50% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.55)); }
  }

  /* 远层晕光：慢速大幅呼吸，与近层周期错开形成干涉感 */
  @keyframes quote-edge-far {
    0%, 100% { filter: drop-shadow(0 0 14px rgba(37, 99, 235, 0.55)); }
    50% { filter: drop-shadow(0 0 24px rgba(37, 99, 235, 0.32)); }
  }

  @media (max-width: 1500px) {
    .quote-text { font-size: 22px; letter-spacing: 0.1em; }
  }

  /* 中窄屏下顶部中央会被搜索框/图例挤占，直接隐藏签名 */
  @media (max-width: 1199px) {
    .quote-panel { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .quote-panel {
      animation: none;
      filter: drop-shadow(0 0 14px rgba(37, 99, 235, 0.45));
    }
    .quote-text {
      animation: quote-fade-in 0.6s ease-out both;
      filter: drop-shadow(0 0 5px rgba(56, 189, 248, 0.7));
    }
  }

  .toolbar {
    left: 18px;
    bottom: 18px;
    padding: 7px;
    display: flex;
    gap: 6px;
  }

  .icon-button {
    width: 36px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 8px;
    background: rgba(148, 163, 184, 0.06);
    color: #cbd5e1;
    cursor: pointer;
    transition: transform 160ms ease, background 160ms ease, color 160ms ease, border-color 160ms ease;
  }

  .icon-button:hover {
    transform: translateY(-1px);
    background: var(--accent-light);
    color: var(--accent-text);
    border-color: rgba(96, 165, 250, 0.42);
  }

  .icon-button:active { transform: translateY(0) scale(0.97); }

  .icon-button svg {
    width: 17px;
    height: 17px;
    stroke-width: 2.1;
  }

  .icon-button.is-active {
    background: var(--accent-light);
    color: var(--accent-text);
    border-color: rgba(96, 165, 250, 0.42);
  }

  /* 笔记目录侧边栏：折叠时树形列表从下往上卷起，顶部标题栏原样保留
     并充当展开把手；宽度与搜索框对齐；
     top 过渡用于搜索候选列表弹出时动态下移让位 */
  .sidebar {
    top: 78px;
    left: 18px;
    /* 高度随目录行数自适应：不设 bottom，顶边紧贴搜索栏下方；
       max-height 兜底，目录展开过多时树形列表内部滚动 */
    max-height: calc(100vh - 152px);
    width: min(310px, calc(100vw - 112px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    clip-path: inset(0 0 0 0 round 12px);
    transition:
      clip-path 320ms cubic-bezier(0.4, 0, 0.2, 1),
      top 260ms cubic-bezier(0.4, 0, 0.2, 1),
      max-height 260ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .sidebar.is-collapsed {
    /* 只保留 44px 标题栏，其余部分卷起隐藏 */
    clip-path: inset(0 0 calc(100% - 44px) 0 round 12px);
    pointer-events: none;
  }

  .sidebar.is-collapsed .sidebar-header {
    pointer-events: auto;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    flex: 0 0 auto;
    cursor: pointer;
    user-select: none;
  }

  .sidebar-title {
    color: var(--title-color);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.04em;
  }

  .sidebar-count {
    margin-left: auto;
    color: var(--muted);
    font-size: 10.5px;
    white-space: nowrap;
  }

  /* 侧边栏头部的收起按钮 */
  .sidebar-collapse {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }

  .sidebar-collapse:hover {
    background: rgba(148, 163, 184, 0.16);
    color: var(--title-color);
  }

  .sidebar-collapse svg { width: 14px; height: 14px; stroke-width: 2.4; }

  .sidebar-tree {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px;
    scrollbar-width: thin;
    scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
  }

  .sidebar-tree::-webkit-scrollbar { width: 6px; }
  .sidebar-tree::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 999px; }

  .tree-row {
    display: flex;
    align-items: center;
    gap: 5px;
    width: 100%;
    border: 0;
    border-radius: 7px;
    background: transparent;
    padding: 4px 7px 4px 4px;
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    color: var(--text-color);
    transition: background 140ms ease, color 140ms ease;
  }

  .tree-row:hover { background: rgba(148, 163, 184, 0.10); }

  .tree-row.is-active { background: rgba(59, 130, 246, 0.18); }

  .tree-chevron {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    border-radius: 4px;
    transition: transform 180ms ease, background 140ms ease;
  }

  .tree-chevron:hover { background: rgba(148, 163, 184, 0.16); color: var(--title-color); }

  .tree-chevron svg { width: 11px; height: 11px; stroke-width: 2.4; }

  .tree-item.is-expanded > .tree-row .tree-chevron { transform: rotate(90deg); }

  .tree-dot {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    border-radius: 999px;
    margin: 0 4.5px;
    box-shadow: 0 0 6px currentColor;
  }

  .tree-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tree-row.is-dir .tree-name { font-weight: 650; color: var(--title-color); }

  .tree-row.is-active .tree-name { color: #dbeafe; }

  .tree-count {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 10px;
  }

  .tree-children {
    margin-left: 11px;
    padding-left: 7px;
    border-left: 1px solid rgba(148, 163, 184, 0.12);
    display: none;
  }

  .tree-item.is-expanded > .tree-children { display: block; }

  /* 搜索面板 - 调整到左上方位置互换 */
  .search-panel {
    top: 18px;
    left: 18px;
    width: min(310px, calc(100vw - 112px));
    height: 48px;
    padding: 0 13px;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .search-panel svg {
    width: 17px;
    height: 17px;
    color: var(--muted);
    flex: 0 0 auto;
  }

  .search-panel input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--title-color);
    font: inherit;
    font-size: 13px;
  }

  .search-panel input::placeholder { color: #5b6b84; }

  /* 搜索结果弹窗优先级提高(z-index: 10)，位置匹配左上方 */
  .search-results {
    position: absolute;
    z-index: 10;
    top: 72px;
    left: 18px;
    width: min(340px, calc(100vw - 34px));
    max-height: min(380px, calc(100vh - 190px));
    overflow: auto;
    padding: 8px;
    display: grid;
    gap: 6px;
  }

  .search-results[hidden] { display: none; }

  .search-result-item {
    width: 100%;
    border: 1px solid rgba(148, 163, 184, 0.14);
    border-radius: 10px;
    background: rgba(148, 163, 184, 0.05);
    color: var(--title-color);
    padding: 8px 10px;
    text-align: left;
    cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
  }

  .search-result-item:hover,
  .search-result-item.is-active {
    border-color: rgba(96, 165, 250, 0.45);
    background: rgba(59, 130, 246, 0.16);
    transform: translateY(-1px);
  }

  .search-result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .search-result-name {
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-result-badge {
    flex: 0 0 auto;
    height: 18px;
    border-radius: 999px;
    padding: 0 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #bfdbfe;
    background: rgba(59, 130, 246, 0.25);
  }

  .search-result-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10.5px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .search-result-type {
    margin-top: 5px;
    font-size: 10px;
    color: #5eead4;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  #tooltip {
    position: fixed;
    z-index: 8;
    min-width: 190px;
    max-width: min(330px, calc(100vw - 28px));
    padding: 10px 12px 11px;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 8px;
    background: rgba(10, 16, 32, 0.85);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
    color: var(--text-color);
    pointer-events: none;
    opacity: 0;
    transition: opacity 140ms ease;
  }

  #tooltip.visible { opacity: 1; }

  .tip-type {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .tip-title {
    margin-top: 7px;
    color: var(--title-color);
    font-size: 14px;
    font-weight: 750;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .tip-path {
    margin-top: 5px;
    color: var(--muted);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 10.5px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .tip-hint {
    margin-top: 6px;
    color: var(--muted);
    font-size: 10.5px;
  }

  #loading,
  #error {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  #loading {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    background: rgba(10, 16, 32, 0.75);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 8px;
    padding: 12px 15px;
    box-shadow: var(--panel-shadow);
  }

  .spinner {
    width: 22px;
    height: 22px;
    border: 2px solid rgba(148, 163, 184, 0.25);
    border-top-color: var(--accent-primary);
    border-radius: 999px;
    animation: spin 760ms linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #error {
    width: min(460px, calc(100vw - 32px));
    padding: 16px 18px;
    border: 1px solid rgba(248, 113, 113, 0.3);
    border-radius: 8px;
    background: rgba(69, 10, 10, 0.5);
    color: #fca5a5;
    box-shadow: var(--panel-shadow);
    font-size: 13px;
    line-height: 1.55;
  }

  #error[hidden],
  #loading[hidden] { display: none; }

  @media (max-width: 760px) {

const quoteTextEl = document.getElementById('quote-text');
